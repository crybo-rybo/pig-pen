name: format

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to the version .clang-format documents; a different major
      # version can format differently and fail the check spuriously.
      - name: Install pinned formatters
        run: |
          pipx install clang-format==22.1.8
          pipx install ruff==0.16.1
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: ruff format
        run: ruff format --check tests
      - name: ruff lint
        run: ruff check tests
