name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned: a different clang-format major can format differently.
      - name: Install pinned formatters
        run: pipx install clang-format==22.1.8 && pipx install ruff==0.16.1
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: ruff format
        run: ruff format --check tests
      - name: ruff lint
        run: ruff check tests

  build-and-test:
    name: build & test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    # scrydantic needs GCC 16.2 or newer, and refuses the GCC 16 snapshots of
    # the Ubuntu toolchain PPA. This is the image that scrydantic's CI pins.
    container:
      image: gcc:16.2.0@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, headless]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v5

      # Debian trixie packages: CMake 3.31, Ninja, gRPC and Protobuf for the
      # llamad stubs, Python for the CLI tests, and SDL3's X11, Wayland, and GL
      # build headers (docs/building.md).
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
