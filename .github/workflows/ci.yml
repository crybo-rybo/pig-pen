name: ci

on:
  push:
    branches: [main]
  pull_request:

# Only run the latest CI for a ref; superseded runs are cancelled to keep
# feedback fast on active branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Full GUI builds (dev/release) plus the headless-only preset, which
  # exercises the CMake path with no SDL3/OpenGL/ImGui. Configure fetches
  # all pinned dependencies, so this also guards the dependency pins.
  build-and-test:
    name: build & test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, headless]
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - uses: actions/checkout@v5

      # Pig Pen requires GCC 16+ with C++26 reflection; the runner image
      # ships GCC 13, so install from the toolchain PPA. libcurl is scry's
      # HTTP transport. The remaining packages are the Ubuntu names for the
      # Linux GUI deps in docs/building.md (harmless on the headless preset).
      - name: Install toolchain and system libraries
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-16 \
            ninja-build \
            pkg-config \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libwayland-dev \
            wayland-protocols

      - name: Show toolchain versions
        run: |
          gcc-16 --version | head -n1
          g++-16 --version | head -n1
          cmake --version | head -n1
          ninja --version
          python3 --version
          pkg-config --modversion libcurl

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
