name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned: a different clang-format major can format differently.
      - name: Install pinned formatters
        run: pipx install clang-format==22.1.8 && pipx install ruff==0.16.1
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: ruff format
        run: ruff format --check tests examples
      - name: ruff lint
        run: ruff check tests examples

  build-and-test:
    name: build & test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, headless]
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - uses: actions/checkout@v5

      # The runner ships GCC 13; GCC 16 comes from the toolchain PPA. The X11,
      # Wayland, and GL headers are SDL3's Linux build deps (docs/building.md).
      - name: Install toolchain and system libraries
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-16 \
            ninja-build \
            pkg-config \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
